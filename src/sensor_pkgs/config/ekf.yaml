/**:
  ros__parameters:
    frequency: 50.0 # Update rate of the filter
    sensor_timeout: 0.2 #Use prediction model only if no sensor data is available within this time frame
    two_d_mode: false #not constrained to x,y but for all 6dof
    publish_tf: true #publish from odom to baselink
    publish_acceleration: false
    permit_corrected_publication: false
    print_diagnostics: true
    debug: false

    #--- Frames ---
    odom_frame: bluerov2/odom
    base_link_frame: bluerov2/base_link
    world_frame: bluerov2/odom

    #Config vector order, 15 entries x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    imu0: /bluerov2/imu
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    #Dvl: body linear velocity
    twist0: /bluerov2/dvl_twist_cov
    twist0_config: [false, false, false,
                    false, false, false,
                    true, true, true,
                    false, false, false,
                    false, false, false]
    twist0_queue_size: 10
    twist0_nodelay: false

    #Zupt zero velocity
    twist1: /bluerov2/zupt_vel
    twist1_config: [false, false, false,
                    false, false, false,
                    true,  true,  false, # Fuses Vx and Vy only
                    false, false, false,
                    false, false, false]
    twist1_queue_size: 10
    twist1_nodelay: false

    #Depth sensor
    pose0: /bluerov2/depth_pose
